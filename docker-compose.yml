services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RESEND_API_KEY: ${RESEND_API_KEY}
      PARTNER_GYM_INBOX: ${PARTNER_GYM_INBOX:-notifications@thalos.at}
    # Bound to localhost only — host nginx terminates TLS and proxies in.
    ports:
      - "127.0.0.1:53000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/de/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
