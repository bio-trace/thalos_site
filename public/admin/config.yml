        label: Deutsch
        file: messages/de.json
        format: json
        fields:
          - name: nav
            label: Navigation
            widget: object
            fields:
              - { name: system, label: System, widget: string }
              - { name: science, label: Science, widget: string }
              - { name: athletes, label: Athletes, widget: string }
              - { name: team, label: Team, widget: string }
              - { name: partnerGyms, label: Partner Gyms, widget: string }
              - { name: applyCta, label: Apply CTA, widget: string }
              - { name: openMenu, label: Open menu, widget: string }
              - { name: closeMenu, label: Close menu, widget: string }
              - { name: switchLang, label: Switch language, widget: string }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: headline, label: Headline, widget: string }
              - { name: sub, label: Subline, widget: string }
              - { name: ctaPrimary, label: CTA Primary, widget: string }
              - { name: ctaSecondary, label: CTA Secondary, widget: string }
          - name: what
            label: What
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: string }
          - name: system
            label: System
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - name: pillars
                label: Pillars
                widget: object
                fields:
                  - name: workouts
                    label: Workouts
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: body, label: Body, widget: string }
                  - name: meals
                    label: Meals
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: body, label: Body, widget: string }
                  - name: recovery
                    label: Recovery
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: body, label: Body, widget: string }
                  - name: data
                    label: Data
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: body, label: Body, widget: string }
          - name: productInMotion
