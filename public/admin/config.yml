backend:
  name: github
  repo: bio-trace/thalos_site
  branch: master
  auth_type: pat

publish_mode: editorial_workflow

media_folder: public/images
public_folder: /images

i18n:
  structure: single_file
  locales: [de, en]
  default_locale: de

collections:
  - name: team
    label: Team
    folder: data/team
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: id
    slug: '{{id}}'
    media_folder: ../../public/images/team
    public_folder: /images/team
    fields:
      - { name: id, label: ID (slug), widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, digits, hyphens only'] }
      - { name: name, label: Name, widget: string }
      - name: role
        label: Role
        widget: object
        fields:
          - { name: de, label: Deutsch, widget: string }
          - { name: en, label: English, widget: string }
      - { name: image, label: Photo, widget: image, required: false }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 0 }

  - name: faq
    label: FAQ
    folder: data/faq
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: id
    slug: '{{id}}'
    fields:
      - { name: id, label: ID (slug), widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, digits, hyphens only'] }
      - name: q
        label: Question
        widget: object
        fields:
          - { name: de, label: Deutsch, widget: string }
          - { name: en, label: English, widget: string }
      - name: a
        label: Answer
        widget: object
        fields:
          - { name: de, label: Deutsch, widget: text }
          - { name: en, label: English, widget: text }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 0 }

  - name: legal
    label: Legal
    files:
      - name: impressum
        label: Impressum
        file: data/legal/impressum.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: datenschutz
        label: Datenschutz
        file: data/legal/datenschutz.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: agb
        label: AGB
        file: data/legal/agb.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: widerruf
        label: Widerruf
        file: data/legal/widerruf.md
        fields:
          - { name: body, label: Body, widget: markdown }

  - name: ui-strings
    label: UI Strings
    files:
