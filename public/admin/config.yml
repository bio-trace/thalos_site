backend:
  name: github
  repo: bio-trace/thalos_site
  branch: master
  auth_type: pat

# Local dev: when `npx decap-server` is running on :8081, Sveltia talks to
# the local filesystem instead of GitHub. Both Docker and static builds
# automatically strip this line in production (see scripts/strip-local-backend.sh).
local_backend: true

publish_mode: editorial_workflow

media_folder: public/images
public_folder: /images

collections:
  - name: team
    label: Team
    folder: data/team
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: id
    slug: '{{id}}'
    media_folder: ../../public/images/team
    public_folder: /images/team
    fields:
      - { name: id, label: ID (slug), widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, digits, hyphens only'] }
      - { name: name, label: Name, widget: string }
      - name: role
        label: Role
        widget: object
        fields:
          - { name: de, label: Deutsch, widget: string }
          - { name: en, label: English, widget: string }
      - { name: image, label: Photo, widget: image, required: false }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 0 }

  - name: faq
    label: FAQ
    folder: data/faq
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: id
    slug: '{{id}}'
    fields:
      - { name: id, label: ID (slug), widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, digits, hyphens only'] }
      - name: q
        label: Question
        widget: object
        fields:
          - { name: de, label: Deutsch, widget: string }
          - { name: en, label: English, widget: string }
      - name: a
        label: Answer
        widget: object
        fields:
          - { name: de, label: Deutsch, widget: text }
          - { name: en, label: English, widget: text }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 0 }

  - name: legal
    label: Legal
    files:
      - name: impressum
        label: Impressum (DE)
        file: data/legal/impressum.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: impressum_en
        label: Imprint (EN)
        file: data/legal/impressum.en.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: datenschutz
        label: Datenschutz (DE)
        file: data/legal/datenschutz.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: datenschutz_en
        label: Privacy (EN)
        file: data/legal/datenschutz.en.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: agb
        label: AGB (DE)
        file: data/legal/agb.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: agb_en
        label: Terms (EN)
        file: data/legal/agb.en.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: widerruf
        label: Widerruf (DE)
        file: data/legal/widerruf.md
        fields:
          - { name: body, label: Body, widget: markdown }
      - name: widerruf_en
        label: Right of withdrawal (EN)
        file: data/legal/widerruf.en.md
        fields:
          - { name: body, label: Body, widget: markdown }

  - name: ui-strings
    label: UI Strings
    files:
      - name: de
        label: Deutsch
        file: messages/de.json
        format: json
        fields:
          - name: nav
            label: Navigation
            widget: object
            fields:
              - { name: system, label: System, widget: string }
              - { name: science, label: Science, widget: string }
              - { name: athletes, label: Athletes, widget: string }
              - { name: team, label: Team, widget: string }
              - { name: partnerGyms, label: Partner Gyms, widget: string }
